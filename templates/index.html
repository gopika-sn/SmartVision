<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVision</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div>
        <h1>SMARTVISION</h1>
        <p>REAL-TIME AI VIDEO ANALYTICS</p>
    </div>

    <div class="status">
        <span></span> SYSTEM ONLINE
    </div>
</header>

<main>

    <!-- CAMERA -->
    <section class="camera-section">

        <h2>● LIVE CAMERA FEED</h2>

        <div class="camera-box">

            <!-- REAL CAMERA -->
            <video id="camera"
                   autoplay
                   playsinline>
            </video>

            <!-- AI PROCESSED FRAME -->
            <img id="output"
                 alt="SmartVision AI output">

            <div id="camera-message">
                Camera is off
            </div>

        </div>

        <button id="startBtn">
            START CAMERA
        </button>

        <p id="cameraStatus"></p>

    </section>


    <!-- ANALYTICS -->
    <section class="analytics">

        <h2>LIVE ANALYTICS</h2>

        <div class="cards">

            <div class="card">
                <small>TRACKED</small>
                <strong id="tracked">0</strong>
            </div>

            <div class="card">
                <small>ENTERED</small>
                <strong id="entered">0</strong>
            </div>

            <div class="card">
                <small>EXITED</small>
                <strong id="exited">0</strong>
            </div>

            <div class="card">
                <small>ZONE A</small>
                <strong id="zone">0</strong>
            </div>

        </div>


        <h3>OBJECTS</h3>

        <div id="objects">
            Waiting for camera...
        </div>


        <h3>SECURITY EVENT</h3>

        <div id="alert">
            SYSTEM NORMAL
        </div>

    </section>

</main>


<footer>
    YOLO26 + BYTE TRACK &nbsp; | &nbsp; SMARTVISION AI
</footer>


<script>

const video = document.getElementById("camera");
const output = document.getElementById("output");
const startBtn = document.getElementById("startBtn");
const message = document.getElementById("camera-message");
const cameraStatus = document.getElementById("cameraStatus");

const tracked = document.getElementById("tracked");
const entered = document.getElementById("entered");
const exited = document.getElementById("exited");
const zone = document.getElementById("zone");
const objects = document.getElementById("objects");
const alertBox = document.getElementById("alert");

let stream = null;
let canvas = document.createElement("canvas");
let processing = false;
let running = false;


startBtn.addEventListener("click", async function () {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        video.style.display = "block";
        message.style.display = "none";

        startBtn.textContent = "CAMERA RUNNING";
        cameraStatus.textContent = "Camera connected";

        running = true;

        processFrame();

    } catch (error) {

        console.error(error);

        cameraStatus.textContent =
            "Camera error: " + error.name;

        message.textContent =
            "Camera could not be started";

    }

});


async function processFrame() {

    if (!running) return;

    /*
       Don't send another request while
       the previous one is still processing.
    */

    if (!processing && video.readyState >= 2) {

        processing = true;

        try {

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const image = canvas.toDataURL(
                "image/jpeg",
                0.65
            );

            const response = await fetch("/process", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    image: image
                })

            });


            if (response.ok) {

                const data = await response.json();

                /*
                   AI result received.
                   Put it over the live camera.
                */

                if (data.image) {

                    output.src =
                        "data:image/jpeg;base64," +
                        data.image;

                    output.style.display = "block";
                }


                tracked.textContent =
                    data.tracked ?? 0;

                entered.textContent =
                    data.entered ?? 0;

                exited.textContent =
                    data.exited ?? 0;

                zone.textContent =
                    data.zone ?? 0;


                if (data.objects &&
                    Object.keys(data.objects).length > 0) {

                    objects.innerHTML = "";

                    for (const name in data.objects) {

                        const item =
                            document.createElement("div");

                        item.textContent =
                            name + ": " +
                            data.objects[name];

                        objects.appendChild(item);
                    }

                }


                if (data.alert) {

                    alertBox.textContent =
                        data.alert;

                } else {

                    alertBox.textContent =
                        "SYSTEM NORMAL";
                }

                cameraStatus.textContent =
                    "AI detection active";

            } else {

                /*
                   IMPORTANT:
                   Even if Render's AI processing
                   fails, the LOCAL CAMERA remains visible.
                */

                cameraStatus.textContent =
                    "Camera active • AI processing unavailable";

            }

        } catch (error) {

            console.error(error);

            cameraStatus.textContent =
                "Camera active • waiting for AI";

        }

        processing = false;
    }


    /*
       Process approximately 5 frames per second
       instead of flooding Render.
    */

    setTimeout(processFrame, 200);

}

</script>

</body>
</html>
